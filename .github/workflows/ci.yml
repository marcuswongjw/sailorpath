name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match local tooling; npm 10 (Node 22) rejects npm 11-style nested esbuild lock entries
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build tolerates missing DB; set dummies so Next doesn't treat them as required secrets
          NEXT_PUBLIC_SITE_URL: https://sailorpath.com
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci

      - name: Enforce client bundle budget
        run: npm run check:bundle
